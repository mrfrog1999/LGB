<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no,email=no,address=no">
  <title>{% block title %}现金理财监控{% endblock %}</title>
  <style>
    :root{
      --bg:#f4f6fb; --card:#fff; --border:#e9edf4; --text:#1e293b;
      --muted:#8b97ab; --brand:#4f46e5; --brand2:#6366f1;
      --up:#e0392b; --down:#16a34a;
      --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);
      --shadow-hover:0 4px 10px rgba(16,24,40,.05),0 16px 40px rgba(16,24,40,.1);
      --radius:16px;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%;max-width:100%}
    html,body{overflow-x:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;
      background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
      background-image:radial-gradient(1200px 420px at 12% -8%,rgba(99,102,241,.08),transparent 60%),
                       radial-gradient(1000px 380px at 92% -12%,rgba(14,165,233,.07),transparent 60%);
      background-attachment:fixed;
      /* 禁止双击缩放：交互元素统一用 manipulation，双击只触发点击不做缩放 */
      touch-action:manipulation;-webkit-touch-callout:none}
    button,.btn,a,input,select,label{touch-action:manipulation}
    a{color:inherit;text-decoration:none}
    /* 统一线性图标：继承 currentColor，自动融入主题色 */
    svg.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:0 0 auto}
    .topbar{background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(18px);
      -webkit-backdrop-filter:saturate(180%) blur(18px);
      border-bottom:1px solid rgba(233,237,244,.9);padding:0 32px;height:66px;
      display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
    .logo{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:700;letter-spacing:-.2px}
    .logo .dot{width:30px;height:30px;border-radius:9px;
      background:linear-gradient(135deg,#6366f1,#4f46e5 55%,#4338ca);
      box-shadow:0 4px 12px rgba(79,70,229,.35),inset 0 1px 1px rgba(255,255,255,.3);
      position:relative;display:flex;align-items:center;justify-content:center}
    .logo .dot svg{width:17px;height:17px;color:#fff;stroke-width:2.6}
    .nav{display:flex;gap:4px;background:#eef1f7;padding:4px;border-radius:12px}
    .nav a{padding:7px 18px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13.5px;transition:.2s}
    .nav a:hover{color:var(--text)}
    .nav a.active{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(16,24,40,.1)}
    .user-chip{display:flex;align-items:center;gap:9px;margin-left:6px}
    .user-avatar{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
      font-size:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,#6366f1,#4f46e5);flex:0 0 auto;overflow:hidden}
    .user-avatar.avatar-svg{background:transparent;padding:0}
    .user-avatar.avatar-svg svg{width:100%;height:100%;display:block;border-radius:9px}
    .user-meta{display:flex;flex-direction:column;line-height:1.25}
    .user-meta b{font-size:12.5px;font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .user-role{font-size:10px;padding:1px 7px;border-radius:20px;font-weight:700;margin-top:2px;width:fit-content}
    .user-role.admin{background:#eef2ff;color:#4f46e5}
    .user-role.member{background:#f1f5f9;color:#64748b}
    .btn-logout{background:#f1f4f9;border:none;width:30px;height:30px;border-radius:9px;cursor:pointer;
      color:var(--muted);display:flex;align-items:center;justify-content:center;transition:.2s}
    .btn-logout:hover{background:#fee2e2;color:#dc2626}
    .btn-logout svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .container{max-width:1360px;margin:0 auto;padding:30px 32px 64px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
      transition:box-shadow .25s ease,transform .25s ease}
    .btn{border:none;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;font-weight:600;
      transition:all .2s ease;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
    .btn-primary{background:linear-gradient(135deg,var(--brand),#4338ca);color:#fff;
      box-shadow:0 4px 12px rgba(79,70,229,.28)}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(79,70,229,.38)}
    .btn-ghost{background:#f1f4f9;color:var(--text)}
    .btn-ghost:hover{background:#e8ecf4;transform:translateY(-1px)}
    .btn-danger{background:#fef2f2;color:#dc2626}
    .btn-danger:hover{background:#fee2e2}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
    .muted{color:var(--muted)}
    .up{color:var(--up)} .down{color:var(--down)}
    /* 弹窗 */
    .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
    .modal-mask.show{display:flex;animation:fadeIn .2s ease}
    .modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:88vh;overflow:auto;
      box-shadow:0 24px 70px rgba(15,23,42,.28);animation:modalUp .25s cubic-bezier(.2,.8,.2,1)}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes modalUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
    .modal-head{padding:22px 26px;border-bottom:1px solid var(--border);display:flex;
      justify-content:space-between;align-items:center}
    .modal-head h3{font-size:17px;letter-spacing:-.2px}
    .modal-close{background:#f1f4f9;border:none;width:30px;height:30px;border-radius:9px;
      font-size:20px;color:var(--muted);cursor:pointer;line-height:1;transition:.2s}
    .modal-close:hover{background:#e8ecf4;color:var(--text)}
    .modal-body{padding:26px}
    .modal-foot{padding:16px 26px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
    .form-row{margin-bottom:18px}
    .form-row label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:#475569}
    .form-row input,.form-row select{width:100%;padding:11px 13px;border:1.5px solid #e2e8f0;border-radius:10px;
      font-size:14px;font-family:inherit;outline:none;transition:.2s;background:#fbfcfe}
    .form-row input:focus,.form-row select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(79,70,229,.1)}
    .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
    /* toast */
    #toast{position:fixed;top:82px;right:24px;z-index:100;display:flex;flex-direction:column;gap:10px}
    .toast-item{padding:13px 18px;border-radius:12px;background:#fff;border:1px solid var(--border);
      box-shadow:var(--shadow-hover);min-width:220px;font-size:14px;font-weight:500;animation:slideIn .25s ease}
    .toast-item.ok{border-left:4px solid var(--down)}
    .toast-item.err{border-left:4px solid var(--up)}
    @keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
    .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
      border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* 银行标签页 */
    .bank-tabs{display:flex;gap:5px;background:#eef1f7;padding:5px;border-radius:12px;margin-bottom:18px}
    .bank-tab{flex:1;padding:10px;border:none;background:transparent;border-radius:9px;
      font-size:14px;font-weight:600;color:#64748b;cursor:pointer;transition:.2s;font-family:inherit}
    .bank-tab.active{background:#fff;box-shadow:0 2px 8px rgba(16,24,40,.1)}
    .bank-tab.active[data-bank="ccb"]{color:#1565c0}
    .bank-tab.active[data-bank="psbc"]{color:#2e7d32}
    .bank-tab.active[data-bank="spdb"]{color:#6d28d9}
    .badge{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:7px;vertical-align:middle;font-weight:700;letter-spacing:.2px}
    .badge-ccb{background:#e3f2fd;color:#1565c0}
    .badge-psbc{background:#e8f5e9;color:#2e7d32}
    .badge-spdb{background:#ede9fe;color:#6d28d9}
    .badge-pending{background:#fff7ed;color:#b45309}
    .badge-settled{background:#eff6ff;color:#1d4ed8}
    .badge-earning{background:#ecfdf5;color:#047857}
    .prod-item{padding:12px 14px;cursor:pointer;border-bottom:1px solid #f1f4f8;transition:.15s;border-radius:8px}
    .prod-item:hover{background:#f6f8fc}
    .prod-item.selected{background:#eef2ff;box-shadow:inset 3px 0 0 var(--brand)}
    .prod-empty{padding:18px;text-align:center;font-size:13px;color:var(--muted)}
    @media (max-width:900px){
      .topbar{padding:8px 14px;height:auto;min-height:54px;flex-wrap:wrap;gap:6px;
        padding-top:calc(8px + env(safe-area-inset-top))}
      .topbar .logo{font-size:16px}
      .nav a{padding:6px 12px;font-size:13px}
      .user-chip{gap:6px}
      .user-meta{display:none}
      .user-avatar{width:28px;height:28px;font-size:12px}
      .container{padding:16px 12px calc(48px + env(safe-area-inset-bottom))}
      .summary-grid{grid-template-columns:1fr 1fr !important;gap:10px !important}
      .summary-grid > *, .bank-grid > *, .split-grid > *{min-width:0}
      .bank-grid{grid-template-columns:1fr !important;gap:12px !important}
      .split-grid{grid-template-columns:1fr !important;gap:0 !important}
      /* 输入框字号 ≥16px：iOS 聚焦时不会自动放大页面 */
      input,select,textarea{font-size:16px !important;}
      .form-row label{font-size:13px}
      .btn{min-height:42px}
      .modal-mask{padding:0;align-items:flex-end}
      .modal{max-width:100% !important;border-radius:16px 16px 0 0;max-height:92vh;
        padding-bottom:env(safe-area-inset-bottom)}
      .modal-body{padding:18px 16px}
      .modal-foot{padding:12px 16px;position:sticky;bottom:0;background:#fff;
        border-top:1px solid var(--border)}
      .modal-foot .btn{flex:1;justify-content:center}
      .bank-tabs{flex-wrap:nowrap;gap:4px;padding:4px}
      .bank-tab{min-width:0;padding:9px 6px;font-size:13px;white-space:nowrap}
    }
  </style>
  {% block head %}{% endblock %}
</head>

  <div class="topbar">
    <div class="logo"><span class="dot"><svg class="ic" style="width:17px;height:17px;stroke-width:2.6"><use href="#i-trending-up"/></svg></span>现金理财监控</div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="nav">
        <a href="/" class="{% if request.path=='/' %}active{% endif %}">总览</a>
        <a href="/settings" class="{% if request.path=='/settings' %}active{% endif %}">设置</a>
      </div>
      {% if current_user %}
      <div class="user-chip">
        <span class="user-avatar avatar-svg" title="{{ '管理员' if current_user.role=='admin' else '成员' }}"><svg><use href="#avatar-{{ 'admin' if current_user.role=='admin' else 'member' }}"/></svg></span>
        <span class="user-meta">
          <b>{{ current_user.display_name or current_user.username }}</b>
          <span class="user-role {{ current_user.role }}">{{ '管理员' if current_user.role=='admin' else '成员' }}</span>
        </span>
        <a href="/logout" class="btn-logout" title="退出登录"><svg class="ic"><use href="#i-logout"/></svg></a>
      </div>
      {% endif %}
    </div>
  </div>
  <div class="container">{% block content %}{% endblock %}</div>

  <div id="toast"></div>

  <!-- 统一确认弹窗（不使用浏览器 confirm） -->
  <div class="modal-mask" id="confirmModal">
    <div class="modal" style="max-width:400px;">
      <div class="modal-head">
        <h3 id="confirm-title">确认操作</h3>
        <button class="modal-close" onclick="closeConfirm()"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="modal-body">
        <div id="confirm-msg" style="font-size:14px;line-height:1.8;"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeConfirm()">取消</button>
        <button class="btn btn-danger" id="confirm-ok" onclick="doConfirm()">确定</button>
      </div>
    </div>
  </div>

  <!-- 信息提示弹窗 -->
  <div class="modal-mask" id="infoModal">
    <div class="modal" style="max-width:420px;">
      <div class="modal-head">
        <h3 id="info-title">提示</h3>
        <button class="modal-close" onclick="closeModal('infoModal')"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="modal-body">
        <div id="info-msg" style="font-size:14px;line-height:1.8;"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-primary" onclick="closeModal('infoModal')">知道了</button>
      </div>
    </div>
  </div>

  <script>
    // 当前登录用户与权限（由后端注入），供各页面控制修改入口显隐
    const IS_ADMIN = {{ 'true' if is_admin else 'false' }};
    const CURRENT_USER = {{ current_user|tojson if current_user else 'null' }};
    function toast(msg,ok=true){
      const box=document.getElementById('toast');
      const el=document.createElement('div');
      el.className='toast-item '+(ok?'ok':'err');
      el.textContent=msg; box.appendChild(el);
      setTimeout(()=>{el.style.opacity='0';el.style.transition='.3s';setTimeout(()=>el.remove(),300)},3500);
    }
    function openModal(id){document.getElementById(id).classList.add('show')}
    function closeModal(id){document.getElementById(id).classList.remove('show')}
    // 云空间网关要求每个 API 请求带 sharecode 访问凭证；
    // 从当前页面 URL 读取，读不到时用默认分享码兜底（预览面板可能丢参数）
    function withSharecode(url){
      const sc=new URLSearchParams(location.search).get('sharecode')||'57BQDYVY3U';
      return url+(url.indexOf('?')>=0?'&':'?')+'sharecode='+encodeURIComponent(sc);
    }
    async function api(url,opts={}){
      const r=await fetch(withSharecode(url),{headers:{'Content-Type':'application/json'},...opts});
      return r.json();
    }

    // 统一确认弹窗：confirmModal(提示文案, 确认后回调, {title, okText, danger})
    let _confirmCb=null;
    function confirmModal(message, onOk, opts={}){
      const {title='确认操作', okText='确定', danger=true}=opts;
      document.getElementById('confirm-title').textContent=title;
      document.getElementById('confirm-msg').textContent=message;
      const btn=document.getElementById('confirm-ok');
      btn.textContent=okText;
      btn.className='btn '+(danger?'btn-danger':'btn-primary');
      _confirmCb=onOk;
      openModal('confirmModal');
    }
    function closeConfirm(){closeModal('confirmModal');_confirmCb=null;}
    function doConfirm(){const cb=_confirmCb;closeConfirm();if(cb)cb();}
    function infoModal(title,message){
      document.getElementById('info-title').textContent=title;
      document.getElementById('info-msg').textContent=message;
      openModal('infoModal');
    }
    // 本地日期（避免 toISOString 的时区偏移）
    function todayStr(){
      const d=new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function addDaysStr(dateStr,n){
      const d=new Date(dateStr+'T00:00:00');
      d.setDate(d.getDate()+n);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    // 移动端：屏蔽双指缩放手势（配合 viewport 的 user-scalable=no 与 touch-action:manipulation）
    ['gesturestart','gesturechange','gestureend'].forEach(ev=>{
      document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
