name: Build Docker Image

# 在 push 到 main/master 或手动触发时，于 GitHub Actions 上构建 Docker 镜像，
# 验证项目可构建。镜像同时推送到 GitHub Container Registry (GHCR)。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 强制要求仓库名全小写，而 github.repository 会保留仓库名原有大小写
      # （如 mrfrog1999/LGB），直接用于 tag 会报 "repository name must be lowercase"。
      # 这里统一转为小写，与 docker-compose.yml 中的 ghcr.io/<owner>/lgb 保持一致。
      - name: 计算小写镜像名
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
