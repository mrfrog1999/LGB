name: Build & Push Image (GHCR)

# 触发条件：push 到 main/master 分支、打 tag、或手动点 Run workflow
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  # GHCR 要求镜像名全小写
  IMAGE_NAME: ghcr.io/mrfrog1999/fpc

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送镜像到 GitHub Packages 必需

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（为 arm64 交叉构建）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 用自动注入的 GITHUB_TOKEN 登录 GHCR，不需要额外配任何 secret
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建结果
        run: |
          echo "已推送以下标签："
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
