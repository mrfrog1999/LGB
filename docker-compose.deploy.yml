services:
  ccb-wealth-monitor:
    image: ghcr.io/mrfrog1999/fpc:latest
    container_name: ccb-wealth-monitor
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DB_PATH=/data/data.db
    volumes:
      - ./data:/data
