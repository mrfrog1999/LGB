# 建行理财收益监控 · 部署版（用 GHCR 镜像，服务器不需要源码）
#
# 用法：
#   1. 私有包先登录一次（token 只需 read:packages 权限）
#        echo '<你的token>' | docker login ghcr.io -u mrfrog1999 --password-stdin
#      （如果已把包设为 Public，可跳过这一步）
#   2. 把下面 MAIL_* 里的邮箱信息填好
#   3. docker compose -f docker-compose.deploy.yml up -d
#   4. 浏览器打开 http://<服务器IP>:8080

services:
  ccb-wealth-monitor:
    image: ghcr.io/mrfrog1999/fpc:latest
    container_name: ccb-wealth-monitor
    restart: unless-stopped
    ports:
      - "8080:8080"          # 左侧改成服务器上要用的端口
    environment:
      # ---- 时区与调度 ----
      TZ: Asia/Shanghai
      FETCH_TIME: "09:10"          # 每天几点抓取并推送邮件
      FETCH_ON_START: "true"       # 首次启动没数据时立即抓一次

      # ---- 存储 ----
      DB_PATH: /data/data.db

      # ---- 首次启动自动订阅的产品（之后都在网页里增删）----
      BOOTSTRAP_CODE: JXJXBGS2023060204
      BOOTSTRAP_NAME: "建信宝按日开放式产品第4期（代销建信理财)"
      SEARCH_KEYWORD: "建信宝按日开放式"
      DEFAULT_PRINCIPAL: "100000"

      # ---- 邮件（要收日报就填这里）----
      MAIL_ENABLED: "true"
      SMTP_HOST: smtp.qq.com
      SMTP_PORT: "465"
      SMTP_SSL: "true"             # 465 用 true；587 改 false（走 STARTTLS）
      SMTP_USER: ""                # 发件邮箱，如 you@qq.com
      SMTP_PASS: ""                # 邮箱授权码（不是登录密码！）
      MAIL_FROM: ""                # 留空则用 SMTP_USER
      MAIL_TO: ""                  # 收件邮箱，多个用英文逗号分隔
      MAIL_SUBJECT_PREFIX: "建行理财收益日报"
    volumes:
      - ./data:/data               # 收益率历史 + 设置持久化，别删
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
