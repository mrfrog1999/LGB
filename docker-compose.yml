services:
  ccb-wealth-monitor:
    build: .
    image: ccb-wealth-monitor:latest
    container_name: ccb-wealth-monitor
    restart: unless-stopped
    ports:
      - "8080:8080"          # 左侧改成本机想用的端口
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai     # 影响定时任务的“每天几点”
      - DB_PATH=/data/data.db
    volumes:
      - ./data:/data         # 收益率历史与设置持久化
